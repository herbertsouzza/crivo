<!DOCTYPE html>

.header-status{ position:absolute; right:16px; top:50%; transform:translateY(-50%); font-family:var(--font-mono); font-size:10px; color:#B9C1CC; }

.cache-indicator.loading{ background:#FFB703; animation:pulse 0.5s infinite; }

<script>

// ============================================================
// ⚡ CACHE LAYER (SOLUÇÃO 1 — IMPLEMENTADO AQUI)
// ============================================================
const cache = {
  leads: null,
  leadsTime: 0,
  notes: {}, // {leadId: {data: [...], time: timestamp}}
  
  isValid(type, leadId, maxAge = 5 * 60 * 1000) { // 5 min default
    if (type === 'leads') {
      return cache.leads && (Date.now() - cache.leadsTime < maxAge);
    }
    if (type === 'notes') {
      return cache.notes[leadId] && (Date.now() - cache.notes[leadId].time < maxAge);
    }
    return false;
  },
  
  get(type, leadId) {
    if (type === 'leads') return cache.leads;
    if (type === 'notes') return cache.notes[leadId]?.data;
    return null;
  },
  
  set(type, data, leadId) {
    if (type === 'leads') {
      cache.leads = data;
      cache.leadsTime = Date.now();
    }
    if (type === 'notes') {
      cache.notes[leadId] = { data, time: Date.now() };
    }
  },
  
  invalidate(type, leadId) {
    if (type === 'leads' || !leadId) cache.leads = null;
    if (type === 'notes' && leadId) delete cache.notes[leadId];
  }
};

// ============================================================
// CONFIG
// ============================================================
const BASE_URL = 'https://script.google.com/macros/s/AKfycbynVOdWdl0jt5vOTZTLY0Pk3jFz5ESgrC4C-bKwMclQTHeS-TVylnnIGG6-hm4l-ozq/exec';
// ☝️ Substitua pela sua URL do Apps Script

const MOTIVO_LIST = ['Valor muito alto', 'Já tem fornecedor', 'Sem orçamento', 'Projeto adiado', 'Outro'];

const state = {
  isOnline: navigator.onLine,
  user: null,
  leads: [],
  currentLead: null,
  currentNotes: [],
  filter: '',
  searchTerm: ''
};

// ============================================================
// MONITORAR CONEXÃO
// ============================================================
window.addEventListener('online', () => {
  state.isOnline = true;
  updateStatus();
});
window.addEventListener('offline', () => {
  state.isOnline = false;
  updateStatus();
});

function updateStatus() {
  const span = document.getElementById('statusSpan');
  span.textContent = state.isOnline ? 'online' : 'offline';
  span.style.color = state.isOnline ? '#52B788' : '#D45B45';
}

// ============================================================
// API CALLS — AGORA COM CACHE!
// ============================================================
function apiGet(action, params = {}) {
  const cacheIcon = document.getElementById('cacheIcon');
  
  // CHECK CACHE PRIMEIRO
  if (action === 'leads' && cache.isValid('leads')) {
    console.log('📦 Cache hit: leads');
    cacheIcon.classList.remove('loading');
    return Promise.resolve({ ok: true, data: cache.get('leads') });
  }
  if (action === 'notes' && cache.isValid('notes', params.leadId)) {
    console.log('📦 Cache hit: notes');
    cacheIcon.classList.remove('loading');
    return Promise.resolve({ ok: true, data: cache.get('notes', params.leadId) });
  }
  
  // SEM CACHE → FETCH DO SERVIDOR
  cacheIcon.classList.add('loading');
  const url = BASE_URL + '?action=' + action + '&' + new URLSearchParams(params);
  
  return fetch(url)
    .then(r => r.json())
    .then(res => {
      // CACHE A RESPOSTA
      if (res.ok) {
        if (action === 'leads') {
          cache.set('leads', res.data);
          console.log('💾 Cached: leads (' + res.data.length + ' items)');
        }
        if (action === 'notes') {
          cache.set('notes', res.data, params.leadId);
          console.log('💾 Cached: notes para lead ' + params.leadId);
        }
      }
      cacheIcon.classList.remove('loading');
      return res;
    })
    .catch(err => {
      console.error('API error:', err);
      cacheIcon.classList.remove('loading');
      return {};
    });
}

function apiPost(action, payload) {
  const cacheIcon = document.getElementById('cacheIcon');
  cacheIcon.classList.add('loading');
  
  return fetch(BASE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...payload })
  })
  .then(r => r.json())
  .then(res => {
    cacheIcon.classList.remove('loading');
    return res;
  })
  .catch(err => {
    console.error('API error:', err);
    cacheIcon.classList.remove('loading');
    return {};
  });
}

// AUTENTICAÇÃO
// ============================================================
document.getElementById('loginBtn').addEventListener('click', () => {
  const usuario = document.getElementById('loginUsuario').value;
  const senha = document.getElementById('loginSenha').value;
  const errorEl = document.getElementById('loginError');
  
  if (!usuario || !senha) {
    errorEl.textContent = 'Preencha usuário e senha';
    return;
  }
  
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  
  apiPost('login', { usuario, senha }).then(res => {
    if (res.ok) {
      state.user = { nome: res.nome, usuario: res.usuario };
      showScreen('view-painel');
      loadLeads();
    } else {
      errorEl.textContent = res.error || 'Erro ao login';
    }
    btn.disabled = false;
  });
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  state.user = null;
  state.leads = [];
  cache.invalidate('leads');
  cache.invalidate('notes');
  showScreen('view-login');
  document.getElementById('loginError').textContent = '';
});

// ============================================================
// NAVEGAÇÃO
// ============================================================
function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.view === screenId) btn.classList.add('active');
  });
  
  document.getElementById('backBtn').classList.remove('show');
  if (screenId === 'view-ficha') document.getElementById('backBtn').classList.add('show');
}

document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
  btn.addEventListener('click', () => showScreen(btn.dataset.view));
});

document.getElementById('backBtn').addEventListener('click', () => {
  showScreen('view-leads');
});

// ============================================================
// CARREGAR LEADS
// ============================================================
function loadLeads() {
  apiGet('leads').then(res => {
    if (res.ok) {
      state.leads = res.data;
      renderPainel();
      renderLeads();
    }
  });
}

// ============================================================
// PAINEL
// ============================================================
function renderPainel() {
  const stats = {
    novo: state.leads.filter(l => l.status === 'Novo').length,
    reuniao: state.leads.filter(l => l.status === 'Reunião').length,
    proposta: state.leads.filter(l => l.status === 'Proposta').length,
    doc: state.leads.filter(l => l.status === 'Documentação').length,
    ganho: state.leads.filter(l => l.status === 'Ganho').length,
    total: state.leads.length
  };

  const followups = state.leads.filter(l => ['Novo', 'Reunião', 'Proposta'].includes(l.status));

  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card">
      <div class="stat-num">${stats.novo}</div>
      <div class="stat-label">NOVO</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${stats.reuniao}</div>
      <div class="stat-label">REUNIÃO</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${stats.proposta}</div>
      <div class="stat-label">PROPOSTA</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${stats.doc}</div>
      <div class="stat-label">DOCUMENTAÇÃO</div>
    </div>
    <div class="stat-card wide">
      <div>
        <div class="stat-num">${stats.total}</div>
        <div class="stat-label">NO PIPELINE</div>
      </div>
      <div style="text-align:right;">
        <div class="stat-num" style="color:var(--green);">${stats.ganho}</div>
        <div class="stat-label">GANHOS</div>
      </div>
    </div>
  `;

  document.getElementById('followupCount').textContent = followups.length;
  document.getElementById('followupList').innerHTML = followups.map(l => `
    <div class="lead-row" onclick="openFicha('${l.id}')">
      <div class="beacon ${getBeacon(l.status)}"></div>
      <div class="info">
        <div class="name">${escapeHtml(l.nome)}</div>
        <div class="meta">${escapeHtml(l.status)} • ${escapeHtml(l.responsavel_atual || '')}</div>
      </div>
      <div class="days"><b>${daysSince(l.data_ultimo_contato)}</b>d</div>
    </div>
  `).join('');
}

// ============================================================
// LISTA DE LEADS
// ============================================================
function renderLeads() {
  let filtered = state.leads;

  if (state.filter) filtered = filtered.filter(l => l.status === state.filter);
  if (state.searchTerm) {
    const term = state.searchTerm.toLowerCase();
    filtered = filtered.filter(l =>
      (l.nome || '').toLowerCase().includes(term) ||
      (l.telefone || '').includes(term)
    );
  }

  if (filtered.length === 0) {
    document.getElementById('leadsList').innerHTML = '<div class="empty-state">Nenhum lead encontrado</div>';
    return;
  }

  document.getElementById('leadsList').innerHTML = filtered.map(l => `
    <div class="lead-row" onclick="openFicha('${l.id}')">
      <div class="beacon ${getBeacon(l.status)}"></div>
      <div class="info">
        <div class="name">${escapeHtml(l.nome)}</div>
        <div class="meta">${escapeHtml(l.status)} • ${escapeHtml(l.responsavel_atual || '')}</div>
      </div>
      <div class="days"><b>${daysSince(l.data_ultimo_contato)}</b>d</div>
    </div>
  `).join('');
}

document.querySelectorAll('.filter-chips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filter = chip.dataset.filter;
    renderLeads();
  });
});

document.getElementById('searchBar').addEventListener('input', e => {
  state.searchTerm = e.target.value;
  renderLeads();
});

// ============================================================
// FICHA
// ============================================================
function openFicha(leadId) {
  const lead = state.leads.find(l => l.id === leadId);
  if (!lead) return;

  state.currentLead = lead;
  
  // Render ficha
  const avatar = lead.nome.charAt(0).toUpperCase();
  document.getElementById('fichaAvatar').textContent = avatar;
  document.getElementById('fichaName').textContent = lead.nome;
  document.getElementById('fichaSub').textContent = lead.telefone + ' • ' + daysSince(lead.data_ultimo_contato) + 'd';

  document.getElementById('fichaInputNome').value = lead.nome || '';
  document.getElementById('fichaInputTelefone').value = lead.telefone || '';
  document.getElementById('fichaInputEmail').value = lead.email || '';
  document.getElementById('fichaInputEmpresa').value = lead.empresa || '';
  document.getElementById('fichaInputCargo').value = lead.cargo || '';
  document.getElementById('fichaInputMotor').value = lead.motor_aquisicao || '';

  document.getElementById('waBtn').href = 'https://wa.me/55' + (lead.telefone || '').replace(/\D/g, '?text=Olá!';

  renderStatusTrack(lead);
  
  document.getElementById('responsavelSelect').value = lead.responsavel_atual || 'Herbert';
  document.getElementById('responsavelSpan').textContent = lead.responsavel_atual || 'Não atribuído';

  document.getElementById('decisorCheck').checked = lead.decisor_confirmado === 'Sim';
  document.getElementById('decisorBlock').style.display = ['Reunião', 'Proposta', 'Documentação'].includes(lead.status) ? 'flex' : 'none';

  document.getElementById('perdaBlock').style.display = lead.status === 'Perdido' ? 'block' : 'none';
  document.getElementById('motivoPerdaInput').value = lead.motivo_perda || '';

  // Carregar notas
  loadNotes(leadId);

  showScreen('view-ficha');
}

function getCurrentLead() {
  return state.currentLead || {};
}

// ============================================================
// ATUALIZAR CAMPO DA FICHA
// ============================================================
document.getElementById('fichaInputNome').addEventListener('blur', () => updateLeadField('nome', this.value));
document.getElementById('fichaInputTelefone').addEventListener('blur', () => updateLeadField('telefone', this.value));
document.getElementById('fichaInputEmail').addEventListener('blur', () => updateLeadField('email', this.value));
document.getElementById('fichaInputEmpresa').addEventListener('blur', () => updateLeadField('empresa', this.value));
document.getElementById('fichaInputCargo').addEventListener('blur', () => updateLeadField('cargo', this.value));
document.getElementById('fichaInputMotor').addEventListener('blur', () => updateLeadField('motor_aquisicao', this.value));

function updateLeadField(field, value) {
  const lead = getCurrentLead();
  if (!lead.id || lead[field] === value) return;

  lead[field] = value;
  postWithFallback('updateLead', { id: lead.id, fields: { [field]: value } }, () => {
    cache.invalidate('leads');  // ← INVALIDA CACHE
    renderPainel();
  });
}

// ============================================================
// DECISOR CONFIRMADO
// ============================================================
document.getElementById('decisorCheck').addEventListener('change', function() {
  const lead = getCurrentLead();
  const value = this.checked ? 'Sim' : 'Não';
  
  postWithFallback('updateLead', { id: lead.id, fields: { decisor_confirmado: value } }, () => {
    lead.decisor_confirmado = value;
    cache.invalidate('leads');  // ← INVALIDA CACHE
    showToast('Decisor ' + value);
  });
});

// ============================================================
// RESPONSÁVEL
// ============================================================
document.getElementById('responsavelSelect').addEventListener('change', function() {
  const lead = getCurrentLead();
  const novoResponsavel = this.value;
  
  postWithFallback('changeResponsavel', { id: lead.id, novoResponsavel, autor: state.user.nome }, () => {
    lead.responsavel_atual = novoResponsavel;
    document.getElementById('responsavelSpan').textContent = novoResponsavel;
    cache.invalidate('leads');  // ← INVALIDA CACHE
    cache.invalidate('notes', lead.id);  // ← INVALIDA CACHE
    loadNotes(lead.id);
    showToast('Responsável: ' + novoResponsavel);
  });
});

// ============================================================
// STATUS
// ============================================================
function renderStatusTrack(lead) {
  const statuses = ['Novo', 'Reunião', 'Proposta', 'Documentação', 'Ganho', 'Perdido'];
  const track = document.getElementById('statusTrack');
  
  const currentIndex = statuses.indexOf(lead.status);
  
  track.innerHTML = statuses.map((s, i) => {
    let className = 'status-pill';
    if (i < currentIndex) className += ' done';
    if (i === currentIndex) className += ' current';
    return `<button class="${className}" data-status="${s}">${s}</button>`;
  }).join('');

  track.querySelectorAll('.status-pill').forEach(btn => {
    btn.addEventListener('click', () => changeLeadStatus(lead, btn.dataset.status));
  });
}

function changeLeadStatus(lead, novoStatus) {
  if (novoStatus === lead.status) return;

  if (novoStatus === 'Documentação' && lead.decisor_confirmado !== 'Sim') {
    if (!confirm('O decisor ainda não foi confirmado. Avançar mesmo assim?')) return;
  }

  let motivoPerda = null;
  if (novoStatus === 'Perdido') {
    motivoPerda = lead.motivo_perda || prompt('Motivo da perda?') || '';
  }

  postWithFallback('changeStatus', { id: lead.id, status: novoStatus, autor: state.user.nome, motivoPerda }, () => {
    lead.status = novoStatus;
    if (motivoPerda) lead.motivo_perda = motivoPerda;
    cache.invalidate('leads');  // ← INVALIDA CACHE
    cache.invalidate('notes', lead.id);  // ← INVALIDA CACHE
    showToast('Status: ' + novoStatus);
    renderStatusTrack(lead);
    document.getElementById('perdaBlock').style.display = novoStatus === 'Perdido' ? 'block' : 'none';
    loadNotes(lead.id);
  });
}

// ============================================================
// NOTAS
// ============================================================
function loadNotes(leadId) {
  apiGet('notes', { leadId }).then(res => {
    if (res.ok) {
      state.currentNotes = res.data;
      renderNotes();
    }
  }).catch(() => {
    const el = document.getElementById('notesLog');
    if (el) el.innerHTML = '<div class="empty-state" style="padding:12px;">Sem conexão.</div>';
  });
}

function renderNotes() {
  const el = document.getElementById('notesLog');
  if (!el) return;
  if (state.currentNotes.length === 0) {
    el.innerHTML = '<div class="empty-state" style="padding:12px;">Nenhuma nota.</div>';
    return;
  }
  el.innerHTML = state.currentNotes.map(n => {
    const isAuto = n.tipo_evento && n.tipo_evento !== 'Nota manual';
    const dateStr = formatDateTime(n.data_hora);
    return `
      <div class="note-item ${isAuto ? 'auto' : ''}">
        <div class="note-meta">${dateStr} · ${escapeHtml(n.autor || '')}${isAuto ? ' · ' + escapeHtml(n.tipo_evento) : ''}</div>
        <div class="note-text">${escapeHtml(n.texto || '')}</div>
      </div>
    `;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

document.getElementById('addNoteBtn').addEventListener('click', addNoteHandler);
document.getElementById('newNoteInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') addNoteHandler();
});

function addNoteHandler() {
  const input = document.getElementById('newNoteInput');
  const texto = input.value.trim();
  if (!texto) return;
  
  const lead = getCurrentLead();
  const btn = document.getElementById('addNoteBtn');
  btn.disabled = true;
  input.value = '';

  postWithFallback('addNote', { leadId: lead.id, autor: state.user.nome, texto, tipoEvento: 'Nota manual' }, () => {
    btn.disabled = false;
    lead.data_ultimo_contato = new Date().toISOString();
    cache.invalidate('leads');  // ← INVALIDA CACHE
    cache.invalidate('notes', lead.id);  // ← INVALIDA CACHE
    loadNotes(lead.id);
  }, () => {
    btn.disabled = false;
    state.currentNotes.push({ autor: state.user.nome, texto, data_hora: new Date().toISOString(), tipo_evento: 'Nota manual (pendente)' });
    renderNotes();
  });
}

// ============================================================
// NOVO LEAD (MODAL)
// ============================================================
const modal = document.getElementById('modalNovoLead');
document.getElementById('fabNewLead').addEventListener('click', () => {
  document.getElementById('newLeadNome').value = '';
  document.getElementById('newLeadTelefone').value = '';
  document.getElementById('duplicateWarning').classList.remove('show');
  modal.classList.add('show');
});
document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

document.getElementById('newLeadTelefone').addEventListener('input', e => {
  const phone = e.target.value.replace(/\D/g, '');
  const dup = state.leads.find(l => (l.telefone || '').replace(/\D/g, '') === phone && phone.length >= 8);
  const warnEl = document.getElementById('duplicateWarning');
  if (dup) {
    warnEl.textContent = 'Já existe: ' + dup.nome + ' (' + dup.status + ')';
    warnEl.classList.add('show');
  } else {
    warnEl.classList.remove('show');
  }
});

document.getElementById('createLeadBtn').addEventListener('click', () => {
  const nome = document.getElementById('newLeadNome').value.trim();
  const telefone = document.getElementById('newLeadTelefone').value.trim();
  const motor = document.getElementById('newLeadMotor').value;

  if (!nome || !telefone) {
    showToast('Preencha nome e telefone');
    return;
  }

  const btn = document.getElementById('createLeadBtn');
  btn.disabled = true;
  btn.textContent = 'Criando...';

  const lead = {
    nome, telefone, motor_aquisicao: motor,
    status: 'Novo', responsavel_atual: state.user.nome,
    decisor_confirmado: 'Não'
  };

  postWithFallback('createLead', { lead }, res => {
    btn.disabled = false;
    btn.textContent = 'Criar lead';
    modal.classList.remove('show');
    cache.invalidate('leads');  // ← INVALIDA CACHE
    cache.invalidate('notes');  // ← INVALIDA CACHE
    showToast('Lead criado');
    loadLeads();
    if (res.id) setTimeout(() => openFicha(res.id), 400);
  }, () => {
    btn.disabled = false;
    btn.textContent = 'Criar lead';
    modal.classList.remove('show');
  });
});

// ============================================================
// HELPERS
// ============================================================
function postWithFallback(action, payload, onSuccess, onError) {
  apiPost(action, payload).then(res => {
    if (res.ok) {
      onSuccess && onSuccess(res);
    } else {
      onError && onError();
      showToast('Erro: ' + (res.error || 'desconhecido'));
    }
  }).catch(() => {
    onError && onError();
    showToast('Sem conexão');
  });
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2500);
}

function getBeacon(status) {
  if (['Novo', 'Reunião'].includes(status)) return 'amber';
  if (['Proposta', 'Documentação'].includes(status)) return 'amber';
  if (status === 'Ganho') return 'green';
  if (status === 'Perdido') return 'red';
  return 'amber';
}

function daysSince(dateStr) {
  if (!dateStr) return 0;
  const d = new Date(dateStr);
  if (isNaN(d)) return 0;
  return Math.floor((Date.now() - d) / 1000 / 60 / 60 / 24);
}

function formatDateTime(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return str;
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
